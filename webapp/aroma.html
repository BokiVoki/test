<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>향료 노트</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16">
<link rel="icon" href="favicon-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="향료 노트">
<meta name="theme-color" content="#F6F3EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* 하루앱·하루로그와 같은 계정(storageKey=haru_session)으로 로그인하는 개인 도구라
     브랜드 컬러(스카이블루+버건디)를 그대로 가져옴 — 두 앱과 같은 톤을 유지.
     레이아웃은 /cha(찻잎 장부)의 "종이 장부"st 카드 구조를 참고하되, 향료 노트라는
     주제에 맞게 살짝 더 차분하고 중성적인 배경 톤(--bg)을 씀. */
  :root{
    --bg:#F6F3EC; --panel:#FFFFFF; --sunk:#EFEADC; --line:#DCD4BE; --line-2:#C8BC9C;
    --text:#2B2720; --muted:#7A715D; --faint:#B3A98C;
    --accent:#0E76AC; --accent-2:#7A2743; --accent-wash:#E3F1F9; --on-accent:#FFFFFF;
    --shadowc:rgba(43,39,32,.12);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    --serif:'Noto Serif KR',serif;
  }
  @media (prefers-color-scheme:dark){:root{--bg:#161411;--panel:#1D1A15;--sunk:#221E18;--line:#332E24;--line-2:#473F30;--text:#EDE7D8;--muted:#A89C80;--faint:#5E5540;--accent:#5FB4E6;--accent-2:#E58FA6;--accent-wash:#10202B;--on-accent:#161411;--shadowc:rgba(0,0,0,.4);}}
  :root[data-theme="light"]{--bg:#F6F3EC;--panel:#FFFFFF;--sunk:#EFEADC;--line:#DCD4BE;--line-2:#C8BC9C;--text:#2B2720;--muted:#7A715D;--faint:#B3A98C;--accent:#0E76AC;--accent-2:#7A2743;--accent-wash:#E3F1F9;--on-accent:#FFFFFF;--shadowc:rgba(43,39,32,.12);}
  :root[data-theme="dark"]{--bg:#161411;--panel:#1D1A15;--sunk:#221E18;--line:#332E24;--line-2:#473F30;--text:#EDE7D8;--muted:#A89C80;--faint:#5E5540;--accent:#5FB4E6;--accent-2:#E58FA6;--accent-wash:#10202B;--on-accent:#161411;--shadowc:rgba(0,0,0,.4);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .hidden{display:none!important;}
  button,input,textarea,select{font:inherit;color:inherit;}
  a{color:var(--accent-2);}

  /* ---- 로그인 (하루앱과 같은 계정) ---- */
  .authwrap{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:80;padding:20px;}
  .authcard{width:100%;max-width:320px;display:flex;flex-direction:column;gap:14px;padding:30px 26px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px var(--shadowc);}
  .authcard h1{font-family:var(--serif);font-size:24px;margin:0 0 2px;color:var(--accent-2);}
  .authcard p.sub{margin:0 0 10px;color:var(--muted);font-size:13px;}
  .authcard form{display:flex;flex-direction:column;gap:10px;}
  .authcard input{font-size:14.5px;padding:10px 11px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);color:var(--text);}
  .authcard input:focus{outline:none;border-color:var(--accent);}
  .authcard .row{display:flex;gap:8px;}
  .authcard .row button{flex:1;font-size:13.5px;padding:10px;cursor:pointer;background:var(--accent);color:var(--on-accent);border:0;border-radius:6px;}
  .authcard .row button#authSignupBtn{background:var(--sunk);color:var(--text);border:1px solid var(--line);}
  #authMsg{font-size:12.5px;color:var(--accent-2);min-height:16px;margin:0;}

  /* ---- 레이아웃 ---- */
  .wrap{max-width:1180px;margin:0 auto;padding:32px 20px 90px;}
  header.hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap;}
  header.hd .brand{font-family:var(--serif);font-size:22px;color:var(--accent-2);}
  header.hd .brand span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);display:block;margin-top:2px;}
  header.hd .hdr-actions{display:flex;align-items:center;gap:10px;}
  header.hd .hdr-actions button{background:none;border:1px solid var(--line);border-radius:6px;padding:7px 11px;font-size:12px;color:var(--muted);cursor:pointer;}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;}
  .tabs button{background:none;border:0;padding:11px 16px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
  .tabs button[aria-selected="true"]{color:var(--accent-2);border-bottom-color:var(--accent-2);font-weight:600;}

  .page{display:block;}
  .page.hidden{display:none;}

  .searchbar{display:flex;align-items:center;gap:8px;margin-bottom:18px;}
  .searchbar input{flex:1;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 2px;font-size:14px;color:var(--text);}
  .searchbar input:focus{outline:none;border-bottom-color:var(--accent);}
  .searchbar .count{font-size:11.5px;color:var(--faint);white-space:nowrap;}

  .addbar{margin-bottom:16px;}
  .btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:6px;padding:9px 16px;font-size:13px;cursor:pointer;}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--muted);}
  .btn.danger{background:none;border:1px solid var(--line);color:var(--accent-2);}

  .cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
  .ncard{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .ncard-head{padding:14px 16px;cursor:pointer;display:flex;align-items:flex-start;gap:10px;}
  .ncard-head .meta{flex:1;min-width:0;}
  .ncard-name{font-family:var(--serif);font-size:15.5px;font-weight:600;}
  .ncard-name:empty::before{content:'이름 없는 노트';color:var(--faint);font-weight:400;}
  .ncard-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .ncard-sub .latin{font-style:italic;}
  .ncard-desc{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.55;max-height:3.2em;overflow:hidden;}
  .ncard-desc:empty{display:none;}
  .ncard-logcount{font-size:10.5px;color:var(--faint);margin-top:8px;font-family:var(--mono);}
  .ncard-caret{color:var(--faint);font-size:12px;margin-top:3px;transition:transform .15s;}
  .ncard.open .ncard-caret{transform:rotate(90deg);}
  .ncard-body{display:none;border-top:1px solid var(--line);padding:14px 16px 16px;}
  .ncard.open .ncard-body{display:block;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px;}
  .field-grid .full{grid-column:1/-1;}
  .field label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:3px;font-family:var(--mono);letter-spacing:.03em;}
  .field input,.field textarea{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:6px 2px;font-size:13.5px;color:var(--text);resize:vertical;}
  .field input:focus,.field textarea:focus{outline:none;border-bottom-color:var(--accent);}
  .field input.latin{font-style:italic;}
  .ncard-foot{display:flex;justify-content:flex-end;margin-top:4px;}

  .logs-sec{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);}
  .logs-sec h4{font-size:11px;color:var(--muted);margin:0 0 9px;font-family:var(--mono);letter-spacing:.03em;text-transform:uppercase;}
  .logrow{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
  .logrow:last-child{border-bottom:0;}
  .logrow .ldate{font-family:var(--mono);font-size:11px;color:var(--accent-2);white-space:nowrap;padding-top:2px;}
  .logrow .ltext{flex:1;font-size:12.5px;line-height:1.6;white-space:pre-wrap;}
  .logrow .ldel{background:none;border:0;color:var(--faint);cursor:pointer;font-size:12px;padding:2px 4px;}
  .logadd{display:flex;gap:7px;margin-top:10px;align-items:flex-start;}
  .logadd input[type="date"]{border:1px solid var(--line);border-radius:4px;padding:6px 7px;font-size:11.5px;background:var(--sunk);color:var(--text);}
  .logadd textarea{flex:1;border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:12.5px;background:var(--sunk);color:var(--text);min-height:34px;resize:vertical;}
  .logadd button{background:var(--accent);color:var(--on-accent);border:0;border-radius:4px;padding:6px 12px;font-size:12px;cursor:pointer;white-space:nowrap;}

  .empty-note{font-size:12.5px;color:var(--faint);padding:30px 0;text-align:center;}

  /* ---- 레시피 카드 ---- */
  .rcard{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent-2);border-radius:8px;padding:16px 18px;margin-bottom:14px;}
  .rcard-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px;}
  .rcard-title{flex:1;font-family:var(--serif);font-size:16px;font-weight:600;border:0;background:none;color:var(--text);width:100%;border-bottom:1px solid transparent;padding:2px 0;}
  .rcard-title:empty::before{content:'제목 없는 레시피';color:var(--faint);font-weight:400;}
  .rcard-title:focus{outline:none;border-bottom-color:var(--accent);}
  .rcard-purpose{font-size:12.5px;color:var(--muted);border:0;border-bottom:1px solid var(--line);background:none;width:100%;padding:6px 2px;margin-bottom:12px;resize:vertical;min-height:30px;}
  .rcard-purpose:focus{outline:none;border-bottom-color:var(--accent);}
  .rcard-purpose:empty::before{content:'이 블렌딩의 목적성(언제·어떤 느낌을 위한 것인지)';color:var(--faint);}
  .ingtbl{width:100%;border-collapse:collapse;margin-bottom:8px;}
  .ingtbl th{text-align:left;font-family:var(--mono);font-size:10px;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--line);letter-spacing:.03em;}
  .ingtbl td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .ingtbl select{width:100%;border:0;background:none;font-size:12.5px;color:var(--text);padding:5px 2px;}
  .ingtbl input[type="number"]{width:72px;border:0;border-bottom:1px solid var(--line);background:none;font-size:12.5px;padding:5px 2px;text-align:right;}
  .ingtbl input[type="number"]:focus{outline:none;border-bottom-color:var(--accent);}
  .ingtbl .pct{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;}
  .ingtbl .idel{background:none;border:0;color:var(--faint);cursor:pointer;font-size:12px;}
  .ing-add,.rcard-delbtn{background:none;border:1px solid var(--line);border-radius:4px;padding:5px 11px;font-size:11.5px;color:var(--muted);cursor:pointer;}
  .rcard-tools{display:flex;justify-content:space-between;align-items:center;margin-top:4px;}

  .explog-sec{margin-top:16px;padding-top:13px;border-top:1px dashed var(--line);}
  .explog-sec h4{font-size:11px;color:var(--muted);margin:0 0 10px;font-family:var(--mono);letter-spacing:.03em;text-transform:uppercase;}
  .expcard{background:var(--sunk);border-radius:6px;padding:10px 12px;margin-bottom:9px;}
  .expcard-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .expcard-head .edate{font-family:var(--mono);font-size:11.5px;color:var(--accent-2);}
  .expcard-head .edel{margin-left:auto;background:none;border:0;color:var(--faint);cursor:pointer;font-size:12px;}
  .expcard-text{font-size:12.5px;line-height:1.6;white-space:pre-wrap;}
  .expadd{background:var(--panel);border:1px dashed var(--line);border-radius:6px;padding:10px 12px;}
  .expadd-row{display:flex;gap:8px;margin-bottom:7px;align-items:center;}
  .expadd-row input[type="date"]{border:1px solid var(--line);border-radius:4px;padding:6px 7px;font-size:11.5px;background:var(--sunk);color:var(--text);}
  .expadd textarea{width:100%;border:1px solid var(--line);border-radius:4px;padding:7px 9px;font-size:12.5px;background:var(--sunk);color:var(--text);min-height:50px;resize:vertical;margin-bottom:7px;}
  .expadd button{background:var(--accent);color:var(--on-accent);border:0;border-radius:4px;padding:6px 13px;font-size:12px;cursor:pointer;}

  /* ---- 백과 ---- */
  .ency-sec{margin-bottom:30px;}
  .ency-sec h2{font-family:var(--serif);font-size:19px;margin:0 0 5px;padding-bottom:7px;border-bottom:2px solid var(--accent-2);}
  .ency-sec > .lede{font-size:12.5px;color:var(--muted);margin:8px 0 16px;line-height:1.7;}
  .ency-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
  .ency-card{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--pc,var(--accent));border-radius:6px;padding:13px 15px;}
  .ency-card b{display:block;font-family:var(--serif);font-size:14px;margin-bottom:2px;}
  .ency-card .sub{font-size:11px;color:var(--faint);margin-bottom:7px;}
  .ency-card p{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 6px;}
  .ency-card .ex{font-size:11px;color:var(--text);background:var(--sunk);border-radius:4px;padding:5px 8px;line-height:1.55;}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:12.5px;display:flex;gap:12px;align-items:center;opacity:0;pointer-events:none;transition:all .18s;z-index:90;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
  .toast button{background:none;border:0;color:var(--accent-2);cursor:pointer;font-size:12.5px;}

  @media (max-width:640px){
    .wrap{padding:22px 14px 70px;}
    .field-grid{grid-template-columns:1fr;}
    .cardgrid{grid-template-columns:1fr;}
    .expadd-row{flex-wrap:wrap;}
  }
</style>
</head>
<body>

<div id="auth" class="authwrap">
  <div class="authcard">
    <h1>향료 노트</h1>
    <p class="sub">하루앱과 같은 계정으로 로그인해요.</p>
    <form id="authForm" method="post" action="#">
      <input id="authEmail" name="username" type="email" placeholder="이메일" autocomplete="username">
      <input id="authPw" name="password" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password">
      <div class="row"><button id="authLoginBtn" type="submit">로그인</button><button id="authSignupBtn" type="button">회원가입</button></div>
    </form>
    <p id="authMsg"></p>
  </div>
</div>

<div id="app" class="hidden">
  <div class="wrap">
    <header class="hd">
      <div class="brand">향료 노트<span>AROMA DATABASE</span></div>
      <div class="hdr-actions">
        <button id="themeBtn" type="button">🌓</button>
        <button id="logoutBtn" type="button">로그아웃</button>
      </div>
    </header>

    <div class="tabs" role="tablist" id="mainTabs">
      <button class="tab" role="tab" aria-selected="true" data-page="page-db">DB</button>
      <button class="tab" role="tab" aria-selected="false" data-page="page-recipe">레시피</button>
      <button class="tab" role="tab" aria-selected="false" data-page="page-ency">백과</button>
    </div>

    <!-- ================= DB ================= -->
    <div class="page" id="page-db">
      <div class="searchbar">
        <input type="text" id="dbSearch" placeholder="🔍 이름·원산지·학명·설명·메모로 검색 (띄어쓰기·대소문자 무시)">
        <span class="count" id="dbSearchCount"></span>
      </div>
      <div class="addbar"><button class="btn" type="button" id="addNoteBtn">+ 새 노트</button></div>
      <div class="cardgrid" id="noteGrid"></div>
      <p class="empty-note hidden" id="noteEmptyMsg">아직 노트가 없어요. "+ 새 노트"로 시작해보세요.</p>
    </div>

    <!-- ================= 레시피 ================= -->
    <div class="page hidden" id="page-recipe">
      <div class="searchbar">
        <input type="text" id="recipeSearch" placeholder="🔍 제목·목적성·실험기록으로 검색 (띄어쓰기·대소문자 무시)">
        <span class="count" id="recipeSearchCount"></span>
      </div>
      <div class="addbar"><button class="btn" type="button" id="addRecipeBtn">+ 새 레시피</button></div>
      <div id="recipeList"></div>
      <p class="empty-note hidden" id="recipeEmptyMsg">아직 레시피가 없어요. "+ 새 레시피"로 블렌딩을 시작해보세요.</p>
    </div>

    <!-- ================= 백과 ================= -->
    <div class="page hidden" id="page-ency">
      <div id="encyBody"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo" class="hidden" type="button">되돌리기</button></div>

<script>
(function(){
  var SUPA_URL='https://mfgiesampazjzgfliuje.supabase.co';
  var SUPA_KEY='sb_publishable_QBlLIrJ8coqH3I-Ij-Q7SA_OUB7KVwV';
  var sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'haru_session'}});

  function $(id){return document.getElementById(id);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
  function pad(n){return (n<10?'0':'')+n;}
  function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  // 검색: 띄어쓰기·대소문자 다 무시
  function norm(s){return (s||'').toString().toLowerCase().replace(/\s+/g,'');}

  var state={uid:null, notes:[], noteLogs:[], recipes:[], recipeLogs:[], openNotes:{}, openRecipes:{}, dbQ:'', recipeQ:''};
  var undoHist=[];

  var toast=$('toast'),toastMsg=$('toastMsg'),toastUndo=$('toastUndo'),tHide;
  function showToast(msg,undo){toastMsg.textContent=msg;if(undo)undoHist.push(undo);toastUndo.classList.toggle('hidden',!undo);toast.classList.add('show');clearTimeout(tHide);tHide=setTimeout(function(){toast.classList.remove('show');},undo?4000:1500);}
  toastUndo.addEventListener('click',function(){var f=undoHist.pop();if(f)f();toast.classList.remove('show');});

  // ===== 로그인 =====
  function creds(){return {email:$('authEmail').value.trim(),password:$('authPw').value};}
  function doLogin(){var c=creds(),m=$('authMsg');if(!c.email||!c.password){m.textContent='이메일과 비밀번호를 입력하세요';return;}m.textContent='로그인 중…';
    sb.auth.signInWithPassword(c).then(function(r){if(r.error){m.textContent='로그인 실패: '+r.error.message;}else{showApp();}});}
  function doSignup(){var c=creds(),m=$('authMsg');if(!c.email||c.password.length<6){m.textContent='이메일 + 6자 이상 비밀번호';return;}m.textContent='가입 중…';
    sb.auth.signUp(c).then(function(r){if(r.error){m.textContent='가입 실패: '+r.error.message;}else if(r.data.session){showApp();}else{m.textContent='가입됨! 로그인을 눌러주세요.';}});}
  $('authForm').addEventListener('submit',function(e){e.preventDefault();doLogin();});
  $('authSignupBtn').addEventListener('click',doSignup);

  // ===== 데이터 로드 =====
  function loadAll(){
    Promise.all([
      sb.from('aroma_notes').select('*').order('created',{ascending:true}),
      sb.from('aroma_note_logs').select('*').order('date',{ascending:false}),
      sb.from('aroma_recipes').select('*').order('created',{ascending:true}),
      sb.from('aroma_recipe_logs').select('*').order('date',{ascending:false})
    ]).then(function(r){
      state.notes=r[0].data||[];
      state.noteLogs=r[1].data||[];
      state.recipes=r[2].data||[];
      state.recipeLogs=r[3].data||[];
      renderNotes();
      renderRecipes();
    });
  }

  function logsForNote(id){return state.noteLogs.filter(function(l){return l.note_id===id;});}
  function logsForRecipe(id){return state.recipeLogs.filter(function(l){return l.recipe_id===id;});}

  // ===== 검색 매칭 =====
  function noteMatches(n,q){
    if(!q)return true;
    var hay=norm(n.name+' '+n.origin+' '+n.latin_name+' '+n.description+' '+logsForNote(n.id).map(function(l){return l.text;}).join(' '));
    return hay.indexOf(q)>=0;
  }
  function recipeMatches(r,q){
    if(!q)return true;
    var hay=norm(r.title+' '+r.purpose+' '+logsForRecipe(r.id).map(function(l){return l.text;}).join(' '));
    return hay.indexOf(q)>=0;
  }

  // ===== DB 탭: 노트 카드 =====
  function noteOptionsHtml(selId){
    return '<option value="">재료 선택</option>' + state.notes.map(function(n){
      return '<option value="'+esc(n.id)+'"'+(n.id===selId?' selected':'')+'>'+esc(n.name||'(이름 없음)')+'</option>';
    }).join('');
  }

  function renderNotes(){
    var q=norm(state.dbQ);
    var list=state.notes.filter(function(n){return noteMatches(n,q);});
    $('noteEmptyMsg').classList.toggle('hidden', state.notes.length>0);
    $('dbSearchCount').textContent = state.dbQ ? (list.length+'/'+state.notes.length) : '';
    $('noteGrid').innerHTML = list.map(function(n){
      var logs=logsForNote(n.id);
      var open=!!state.openNotes[n.id];
      return '<div class="ncard'+(open?' open':'')+'" data-id="'+esc(n.id)+'">' +
        '<div class="ncard-head" data-act="toggle">' +
          '<div class="meta">' +
            '<div class="ncard-name">'+esc(n.name)+'</div>' +
            '<div class="ncard-sub">'+(n.origin?esc(n.origin):'')+(n.origin&&n.latin_name?' · ':'')+(n.latin_name?'<span class="latin">'+esc(n.latin_name)+'</span>':'')+'</div>' +
            '<div class="ncard-desc">'+esc(n.description)+'</div>' +
            '<div class="ncard-logcount">메모 '+logs.length+'개</div>' +
          '</div>' +
          '<div class="ncard-caret">▸</div>' +
        '</div>' +
        '<div class="ncard-body">' +
          '<div class="field-grid">' +
            '<div class="field"><label>이름</label><input type="text" data-field="name" value="'+esc(n.name)+'"></div>' +
            '<div class="field"><label>원산지</label><input type="text" data-field="origin" value="'+esc(n.origin)+'"></div>' +
            '<div class="field full"><label>학명</label><input type="text" class="latin" data-field="latin_name" value="'+esc(n.latin_name)+'"></div>' +
            '<div class="field full"><label>설명</label><textarea data-field="description" rows="2">'+esc(n.description)+'</textarea></div>' +
          '</div>' +

          '<div class="logs-sec">' +
            '<h4>일자별 메모</h4>' +

            '<div class="logadd">' +

              '<button type="button" data-act="addlog">추가</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

  $('addNoteBtn').addEventListener('click',function(){
    var row={id:uid('an'),owner:state.uid,name:'',origin:'',latin_name:'',description:'',created:new Date().toISOString(),updated:new Date().toISOString()};
    state.notes.unshift(row);
    state.openNotes[row.id]=true;
    renderNotes();
    sb.from('aroma_notes').upsert(row).then(function(){});
  });

  function saveNote(id){
    var n=state.notes.find(function(x){return x.id===id;});
    if(!n)return;
    n.updated=new Date().toISOString();
    sb.from('aroma_notes').upsert(n).then(function(){});
  }

  $('noteGrid').addEventListener('click',function(e){
    var card=e.target.closest('.ncard'); if(!card)return;
    var id=card.getAttribute('data-id');
    var act=e.target.getAttribute('data-act');
    if(e.target.closest('[data-act="toggle"]') && !act){
      state.openNotes[id]=!state.openNotes[id];
      renderNotes();
      return;
    }
    if(act==='delnote'){
      var idx=state.notes.findIndex(function(x){return x.id===id;});
      var removed=state.notes[idx], removedLogs=logsForNote(id);
      state.notes.splice(idx,1);
      state.noteLogs=state.noteLogs.filter(function(l){return l.note_id!==id;});
      renderNotes();
      sb.from('aroma_notes').delete().eq('id',id).then(function(){});
      showToast('노트를 지웠어요',function(){
        state.notes.splice(idx,0,removed);
        state.noteLogs=state.noteLogs.concat(removedLogs);
        renderNotes();
        sb.from('aroma_notes').upsert(removed).then(function(){
          return Promise.all(removedLogs.map(function(l){return sb.from('aroma_note_logs').upsert(l);}));
        });
      });
    }
    if(act==='addlog'){
      var dateIn=card.querySelector('.newlogdate'), textIn=card.querySelector('.newlogtext');
      var text=(textIn.value||'').trim();
      if(!text)return;
      var log={id:uid('anl'),owner:state.uid,note_id:id,date:dateIn.value||todayISO(),text:text,created:new Date().toISOString()};
      state.noteLogs.unshift(log);
      renderNotes();
      sb.from('aroma_note_logs').upsert(log).then(function(){});
    }
    if(act==='dellog'){
      var logRow=e.target.closest('.logrow');
      var logId=logRow.getAttribute('data-log-id');
      var lidx=state.noteLogs.findIndex(function(l){return l.id===logId;});
      var removedLog=state.noteLogs[lidx];
      state.noteLogs.splice(lidx,1);
      renderNotes();
      sb.from('aroma_note_logs').delete().eq('id',logId).then(function(){});
      showToast('메모를 지웠어요',function(){
        state.noteLogs.splice(lidx,0,removedLog);
        renderNotes();
        sb.from('aroma_note_logs').upsert(removedLog).then(function(){});

  // 입력칸 자체를 다시 그리면(innerHTML 재생성) 블러→포커스 전환이 진행 중인 브라우저의
  // 내부 DOM 변경과 충돌해(" node to be removed is no longer a child" 오류) 깨지므로,
  // 카드 헤더의 요약 텍스트만 직접 patch하고 입력칸 자체는 건드리지 않음.
  function patchNoteCardHeader(id){
    var card=$('noteGrid').querySelector('.ncard[data-id="'+id+'"]');
    var n=state.notes.find(function(x){return x.id===id;});
    if(!card||!n)return;
    var nameEl=card.querySelector('.ncard-name'); if(nameEl)nameEl.textContent=n.name;
    var subEl=card.querySelector('.ncard-sub');
    if(subEl)subEl.innerHTML=(n.origin?esc(n.origin):'')+(n.origin&&n.latin_name?' · ':'')+(n.latin_name?'<span class="latin">'+esc(n.latin_name)+'</span>':'');
    var descEl=card.querySelector('.ncard-desc'); if(descEl)descEl.textContent=n.description;
  }

  $('noteGrid').addEventListener('change',function(e){
    var field=e.target.getAttribute('data-field');
    if(!field)return;
    var card=e.target.closest('.ncard');
    var id=card.getAttribute('data-id');
    var n=state.notes.find(function(x){return x.id===id;});
    if(!n)return;
    n[field]=e.target.value;
    saveNote(id);
    patchNoteCardHeader(id);
  });

  $('dbSearch').addEventListener('input',function(e){state.dbQ=e.target.value;renderNotes();});

  // ===== 레시피 탭 =====
  function recipeTotalRatio(items){return (items||[]).reduce(function(s,it){return s+(parseFloat(it.ratio)||0);},0);}

  function renderRecipes(){
    var q=norm(state.recipeQ);
    var list=state.recipes.filter(function(r){return recipeMatches(r,q);});
    $('recipeEmptyMsg').classList.toggle('hidden', state.recipes.length>0);
    $('recipeSearchCount').textContent = state.recipeQ ? (list.length+'/'+state.recipes.length) : '';
    $('recipeList').innerHTML = list.map(function(r){
      var items=r.items||[];
      var total=recipeTotalRatio(items);
      var logs=logsForRecipe(r.id);
      var rows=items.map(function(it,i){
        var ratio=parseFloat(it.ratio)||0;
        var pct=total>0 ? (ratio/total*100).toFixed(1)+'%' : '';
        return '<tr data-i="'+i+'">' +
          '<td><select data-field="noteId">'+noteOptionsHtml(it.noteId)+'</select></td>' +
          '<td><input type="number" step="0.1" min="0" data-field="ratio" value="'+esc(it.ratio)+'"></td>' +
          '<td class="pct">'+pct+'</td>' +
          '<td><button class="idel" type="button" data-act="delitem">✕</button></td>' +
        '</tr>';
      }).join('');
      return '<div class="rcard" data-id="'+esc(r.id)+'">' +
        '<div class="rcard-head">' +
          '<div class="rcard-title" contenteditable="true" data-field="title">'+esc(r.title)+'</div>' +
        '</div>' +
        '<div class="rcard-purpose" contenteditable="true" data-field="purpose">'+esc(r.purpose)+'</div>' +
        '<table class="ingtbl"><thead><tr><th>재료</th><th>비율</th><th></th><th></th></tr></thead><tbody>'+rows+'</tbody></table>' +
        '<div class="rcard-tools">' +
          '<button class="ing-add" type="button" data-act="additem">+ 재료 추가</button>' +
          '<button class="rcard-delbtn" type="button" data-act="delrecipe">레시피 삭제</button>' +
        '</div>' +
        '<div class="explog-sec">' +
          '<h4>일자별 블렌딩 실험기록</h4>' +
          (logs.length ? logs.map(function(l){
            return '<div class="expcard" data-log-id="'+esc(l.id)+'"><div class="expcard-head"><span class="edate">'+esc(l.date)+'</span><button class="edel" type="button" data-act="delexp">✕</button></div><div class="expcard-text">'+esc(l.text)+'</div></div>';
          }).join('') : '') +
          '<div class="expadd">' +
            '<div class="expadd-row"><input type="date" class="newexpdate" value="'+todayISO()+'"></div>' +
            '<textarea class="newexptext" placeholder="오늘 시도한 블렌딩 결과·느낀 점…"></textarea>' +
            '<button type="button" data-act="addexp">기록 추가</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function saveRecipe(id){
    var r=state.recipes.find(function(x){return x.id===id;});
    if(!r)return;
    r.updated=new Date().toISOString();
    sb.from('aroma_recipes').upsert(r).then(function(){});

  $('recipeList').addEventListener('click',function(e){
    var card=e.target.closest('.rcard'); if(!card)return;
    var id=card.getAttribute('data-id');
    var r=state.recipes.find(function(x){return x.id===id;});
    var act=e.target.getAttribute('data-act');
    if(act==='additem'){
      r.items=(r.items||[]).concat([{noteId:'',ratio:1}]);
      renderRecipes();
      saveRecipe(id);
    }
    if(act==='delitem'){
      var tr=e.target.closest('tr');
      var i=parseInt(tr.getAttribute('data-i'));
      r.items.splice(i,1);
      renderRecipes();
      saveRecipe(id);
    }
    if(act==='delrecipe'){
      var idx=state.recipes.findIndex(function(x){return x.id===id;});
      var removed=state.recipes[idx], removedLogs=logsForRecipe(id);
      state.recipes.splice(idx,1);
      state.recipeLogs=state.recipeLogs.filter(function(l){return l.recipe_id!==id;});
      renderRecipes();
      sb.from('aroma_recipes').delete().eq('id',id).then(function(){});
      showToast('레시피를 지웠어요',function(){
        state.recipes.splice(idx,0,removed);
        state.recipeLogs=state.recipeLogs.concat(removedLogs);

      if(!text)return;

        state.recipeLogs.splice(lidx,0,removedLog);
        renderRecipes();
        sb.from('aroma_recipe_logs').upsert(removedLog).then(function(){});
      });
    }
  });

  // renderNotes와 같은 이유로, 입력 중이던 셀렉트/입력칸을 통째로 다시 그리면
  // 블러→포커스 전환과 충돌하므로 퍼센트 표시만 patch하고 입력칸 자체는 안 건드림.
  function patchRecipeCardPct(id){
    var card=$('recipeList').querySelector('.rcard[data-id="'+id+'"]');
    var r=state.recipes.find(function(x){return x.id===id;});
    if(!card||!r)return;
    var total=recipeTotalRatio(r.items);
    card.querySelectorAll('.ingtbl tr[data-i]').forEach(function(tr){
      var i=parseInt(tr.getAttribute('data-i'));
      var ratio=parseFloat((r.items[i]||{}).ratio)||0;
      var pctEl=tr.querySelector('.pct');
      if(pctEl)pctEl.textContent = total>0 ? (ratio/total*100).toFixed(1)+'%' : '';
    });
  }

  $('recipeList').addEventListener('change',function(e){
    var card=e.target.closest('.rcard'); if(!card)return;
    var id=card.getAttribute('data-id');
    var r=state.recipes.find(function(x){return x.id===id;});
    var field=e.target.getAttribute('data-field');
    if(field==='noteId'||field==='ratio'){
      var tr=e.target.closest('tr');
      var i=parseInt(tr.getAttribute('data-i'));
      r.items[i][field]= field==='ratio' ? (parseFloat(e.target.value)||0) : e.target.value;
      patchRecipeCardPct(id);
      saveRecipe(id);
    }
  });

    var id=card.getAttribute('data-id');

    {name:'머스크', color:'#9C8F7A', desc:'피부에 가까운 포근하고 관능적인 향. 지속력이 매우 길어 베이스에 자주 씀.', ex:'화이트머스크, 암브레트시드(식물성 머스크)'},
    {name:'가죽·스모키', color:'#4A3A2C', desc:'태운 나무·가죽을 연상시키는 거칠고 강한 향.', ex:'버치타르, 카데오일, 스웨이드'}

    {name:'수증기 증류법', hanja:'Steam Distillation', color:'#0E76AC',

    {name:'엔플뢰라주', hanja:'Enfleurage', color:'#C9779E',

      ex:'앰버그리 팅크처, 바닐라 팅크처, 벤조인 팅크처'}

  function renderEncyGrid(arr){
    return '<div class="ency-grid">' + arr.map(function(it){
      return '<div class="ency-card" style="--pc:'+it.color+';"><b>'+esc(it.name)+'</b>' +
        (it.sub||it.hanja ? '<div class="sub">'+esc(it.sub||it.hanja)+'</div>' : '') +
        '<p>'+esc(it.desc)+'</p>' +
        (it.ex ? '<div class="ex">'+esc(it.ex)+'</div>' : '') +
      '</div>';
    }).join('') + '</div>';
  }

  function renderEncy(){
    $('encyBody').innerHTML =
      '<section class="ency-sec"><h2>노트의 구조 — 탑 · 미들 · 베이스</h2>' +
      '<p class="lede">향수 한 방울 안에서도 휘발 속도가 다른 세 층이 시간차를 두고 펼쳐집니다. 블렌딩할 때 세 층을 고루 섞어야 시간이 지나도 향이 비어 보이지 않습니다.</p>' +
      renderEncyGrid(NOTE_CLASSES) + '</section>' +

      renderEncyGrid(EXTRACT) + '</section>';
  }
  renderEncy();

})();
</script>
